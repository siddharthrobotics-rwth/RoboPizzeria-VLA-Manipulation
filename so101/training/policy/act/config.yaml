# Evidence note: run timings/losses in comments below are inherited anecdotes.
# Raw logs/checkpoints are absent locally; these are not verified portfolio results.
# ACT from scratch on robotpizzacup/robot-pizza-cup-1 (LeRobot 0.6.1).
#
# Dataset: 397 episodes, 176039 frames, 30 fps, one task, SO-101 follower.
# Cameras: observation.images.front + observation.images.top, 640×480.
# Mean episode is ~443 frames (~15 s): pick several toppings and place them.
#
# Horizon: predict 100 steps (3.3 s), execute 50 (1.7 s), then replan.
# Temporal ensembling is off — it needs n_action_steps=1 and smears the gripper.
# ~2.7 epochs at batch 16 (30000 * 16 / 176039). A 30k-step batch-8 run on this
# dataset was still falling at 15k (L1 ~0.25) and only reached L1 ~0.20 at 30k
# (1.4 epochs). Constant AdamW 1e-5 (ACT preset). Stop there and roll out;
# another 70k steps does not match that curve.
# RTX PRO 6000 can try --batch_size=32. L40S should stay at 16 (native 640×480).
# AMP is already on. ACT has no compile switch. Keep native 640×480; a
# resize would change what the policy sees. A batch-8 run was ~21 steps/s.
#
# CPU smoke (train_local.sh refuses more than 200 steps):
#   bash training/scripts/train_pizza.sh act 20
# GPU:
#   bash training/scripts/run_serverless.sh act
#   # or, on a DevLab, lerobot-train --config_path=training/policy/act/config.yaml

policy:
  type: act
  push_to_hub: false
  device: cuda
  use_amp: true
  chunk_size: 100
  n_action_steps: 50
  n_obs_steps: 1
  vision_backbone: resnet18
  pretrained_backbone_weights: ResNet18_Weights.IMAGENET1K_V1
  use_vae: true
  kl_weight: 10.0
  dropout: 0.1
  optimizer_lr: 1.0e-5
  optimizer_lr_backbone: 1.0e-5
  optimizer_weight_decay: 1.0e-4

dataset:
  repo_id: robotpizzacup/robot-pizza-cup-1
  video_backend: pyav
  return_uint8: true
  image_transforms:
    enable: true
    max_num_transforms: 2
    tfs:
      brightness:
        weight: 1.0
        type: ColorJitter
        kwargs:
          brightness: [0.8, 1.2]
      contrast:
        weight: 1.0
        type: ColorJitter
        kwargs:
          contrast: [0.8, 1.2]
      saturation:
        weight: 1.0
        type: ColorJitter
        kwargs:
          saturation: [0.8, 1.2]
      hue:
        weight: 1.0
        type: ColorJitter
        kwargs:
          hue: [-0.03, 0.03]
      sharpness:
        weight: 0.0
        type: Identity
      affine:
        weight: 0.0
        type: Identity

seed: 1000
num_workers: 8
steps: 30000
batch_size: 16
log_freq: 50
save_freq: 10000
env_eval_freq: 0

wandb:
  enable: true
  disable_artifact: true
  project: robotpizzacup
